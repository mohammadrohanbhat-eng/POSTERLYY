<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POSTERLY Admin</title><style>body{font-family:system-ui;margin:0;background:#0b0b0d;color:#fff}main{max-width:1200px;margin:auto;padding:30px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.card{background:#151519;border:1px solid #29292f;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}input,select,button{padding:10px;border-radius:10px;border:1px solid #333;background:#0f0f12;color:#fff}button{cursor:pointer;background:#fff;color:#111}.danger{color:#ff6b6b}.muted{color:#999;font-size:13px}.order{border:1px solid #2a2a30;border-radius:14px;padding:14px}.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}</style></head><body><main><div class="top"><div><h1>POSTERLY ADMIN</h1><div class="muted">Orders & tracking</div></div><button onclick="load()">Refresh</button></div><div class="card"><input id="pw" type="password" placeholder="Admin password" style="min-width:260px"><button onclick="login()">Load Orders</button><span id="msg" class="muted"></span></div><div id="stats"></div><div id="orders" class="grid"></div></main><script>let password='';function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function login(){password=document.getElementById('pw').value;await load()}async function load(){if(!password)return;const r=await fetch('/api/admin/orders',{headers:{'x-admin-password':password}});const d=await r.json();if(!r.ok){document.getElementById('msg').textContent=d.error;return}document.getElementById('msg').textContent='';document.getElementById('stats').innerHTML='<div class="card">Total orders: <b>'+d.orders.length+'</b></div>';document.getElementById('orders').innerHTML=d.orders.map(o=>`<div class="order"><h3>${esc(o.orderId)}</h3><div class="row"><span>Customer</span><b>${esc(o.customer.name)}</b></div><div class="row"><span>Mobile</span><b>${esc(o.customer.mobile)}</b></div><div class="row"><span>Email</span><b>${esc(o.customer.email)}</b></div><div class="row"><span>Total</span><b>₹${o.total}</b></div><div class="row"><span>Payment</span><b>${esc(o.paymentStatus)}</b></div><div class="row"><span>Status</span><b>${esc(o.orderStatus)}</b></div><div class="muted">${esc(o.customer.address)}, ${esc(o.customer.city)}, ${esc(o.customer.state)} - ${esc(o.customer.pin)}</div><div class="actions"><select id="s-${o.orderId}">${['PAYMENT PENDING','PAID','PROCESSING','SHIPPED','DELIVERED','CANCELLED'].map(s=>`<option ${s===o.orderStatus?'selected':''}>${s}</option>`).join('')}</select><input id="t-${o.orderId}" value="${esc(o.trackingNumber||'')}" placeholder="Tracking number"><button onclick="updateOrder('${o.orderId}')">Save</button></div></div>`).join('')}async function updateOrder(id){const r=await fetch('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-password':password},body:JSON.stringify({orderStatus:document.getElementById('s-'+id).value,trackingNumber:document.getElementById('t-'+id).value})});const d=await r.json();if(!r.ok)alert(d.error);else load()}</script></body></html>
